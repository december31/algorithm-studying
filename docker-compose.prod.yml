services:
  # =================================================================
  # Database Service (PostgreSQL 16)
  # =================================================================
  db:
    image: postgres:16-alpine
    container_name: algo-dungeon-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-algo_dungeon}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-algo_dungeon}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # =================================================================
  # Backend Service (FastAPI)
  # =================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: algo-dungeon-backend:latest
    container_name: algo-dungeon-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - NODE_ENV=production
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-algo_dungeon}
      - CORS_ORIGINS=["*"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  # =================================================================
  # Frontend Service (Nginx + Static SPA + API Proxy)
  # =================================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: algo-dungeon-frontend:prod
    container_name: algo-dungeon-frontend-prod
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network

  # =================================================================
  # Cloudflare Tunnel Service
  # =================================================================
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: algo-dungeon-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - frontend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db-data:
    driver: local
